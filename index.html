<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#150e1e">
<title>薯片伊塔 · 生日快乐</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:
      radial-gradient(75% 55% at 50% 10%, rgba(255,150,95,.26), transparent 62%),
      radial-gradient(120% 90% at 50% 0%, #3b2440 0%, #1a1126 46%, #08060e 100%);
    color:#fff2f6;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    display:grid;place-items:center;
  }
  #fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}

  main{
    position:relative;z-index:2;width:100%;max-width:540px;
    display:flex;flex-direction:column;align-items:center;
    gap:clamp(6px,1.6vh,16px);padding:3vh 18px 4vh;text-align:center;
  }

  /* ---------- 舞台 ---------- */
  .stage{
    position:relative;height:min(40vh,296px);aspect-ratio:1/1;flex:none;
  }
  .glow{
    position:absolute;inset:-16% -24%;border-radius:50%;
    background:conic-gradient(from 20deg,#ffb37a,#ff8fb0,#c79bff,#8ff0dd,#ffd76e,#ffb37a);
    filter:blur(42px);opacity:.22;animation:spin 16s linear infinite;
  }
  .glow2{
    position:absolute;inset:-10% -6%;border-radius:50%;
    background:radial-gradient(closest-side, rgba(255,200,160,.22), transparent 72%);
  }
  #singer{
    position:absolute;inset:0;opacity:.94;transform:scale(.955);
    transition:opacity .55s ease, transform .95s cubic-bezier(.16,1.3,.4,1);
  }
  #singer.in{opacity:1;transform:none;}
  @keyframes spin{to{transform:rotate(360deg)}}

  .halo{
    position:absolute;inset:-12% -18%;border-radius:50%;z-index:0;
    background:conic-gradient(from 0deg,#ffd6a5,#ff9dc0,#c9a6ff,#8ff0dd,#ffd6a5);
    filter:blur(46px);opacity:.26;animation:spin 18s linear infinite;
  }
  .floor{
    position:absolute;left:50%;bottom:1%;width:88%;height:18%;
    transform:translateX(-50%);border-radius:50%;z-index:1;
    background:radial-gradient(closest-side,rgba(255,195,228,.62),rgba(255,150,200,.18) 62%,transparent 80%);
    filter:blur(9px);
  }
  .ring{
    position:absolute;inset:-3.5%;border-radius:50%;z-index:1;
    border:1px dashed rgba(255,255,255,.26);
    animation:spin 46s linear infinite;
  }
  .bob{
    position:absolute;inset:0;z-index:2;
    animation:float 4.2s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateY(-1.6%)}
    50%{transform:translateY(1.6%)}
  }
  .avatar{
    width:100%;height:100%;border-radius:50%;overflow:hidden;
    box-shadow:0 0 0 3px rgba(255,255,255,.16),0 18px 44px rgba(10,6,18,.55);
  }
  .avatar img{
    width:100%;height:100%;object-fit:cover;object-position:center 36%;display:block;
  }
  #singer.sing .avatar{animation:beat 1.35s ease-in-out infinite;}
  @keyframes beat{0%,100%{transform:scale(1)}45%{transform:scale(1.025)}}

  /* ---------- 文字 ---------- */
  .name{
    font-size:clamp(30px,9.6vw,50px);font-weight:800;letter-spacing:.04em;line-height:1.2;
    background:linear-gradient(100deg,#ffe1a8,#ffa9c4 34%,#d9a6ff 62%,#8ff0dd 88%,#ffe1a8);
    background-size:230% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 24px rgba(255,130,170,.42));
    animation:shift 7s linear infinite;cursor:pointer;user-select:none;
  }
  @keyframes shift{to{background-position:230% 0}}
  .name.bump{animation:shift 7s linear infinite, bump .42s ease;}
  @keyframes bump{40%{transform:scale(1.06)}100%{transform:scale(1)}}

  .alias{
    font-size:clamp(12px,3.4vw,13.5px);letter-spacing:.22em;color:rgba(255,214,232,.62);
    height:0;opacity:0;overflow:hidden;transition:height .45s ease,opacity .6s ease;
  }
  .alias.show{height:1.6em;opacity:1;}
  .alias em{font-style:normal;color:#ffb6d0;}

  /* ---------- 歌词 ---------- */
  .lyr-box{
    position:relative;width:100%;height:3.2em;display:flex;align-items:center;justify-content:center;
  }
  .lyr{
    font-size:clamp(16px,4.7vw,21px);letter-spacing:.12em;line-height:1.6;
    color:rgba(255,240,245,.94);
    text-shadow:0 0 12px rgba(255,150,190,.55),0 0 34px rgba(255,110,170,.28);
    opacity:0;transform:translateY(10px);
    transition:opacity .34s ease,transform .34s ease;
  }
  .lyr.on{opacity:1;transform:none;}

  /* ---------- 按钮 ---------- */
  #start{
    margin-top:4px;padding:14px 30px;border-radius:999px;cursor:pointer;font-family:inherit;
    font-size:clamp(14px,3.9vw,16px);letter-spacing:.08em;color:#fff;
    border:1px solid rgba(255,255,255,.3);
    background:linear-gradient(120deg,rgba(255,164,192,.4),rgba(255,214,148,.32));
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    animation:pulse 2.4s infinite;transition:transform .15s;
  }
  #start:active{transform:scale(.96);}
  #start.gone{display:none;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,150,190,.5)}
    70%{box-shadow:0 0 0 20px rgba(255,150,190,0)}
    100%{box-shadow:0 0 0 0 rgba(255,150,190,0)}
  }

  /* ---------- 结尾 ---------- */
  .card{
    position:fixed;inset:0;z-index:9;display:none;place-items:center;padding:26px;
    background:rgba(8,6,12,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  .card.show{display:grid;animation:fade .7s ease both;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .card .inner{max-width:420px;text-align:center;animation:rise .85s cubic-bezier(.2,1.4,.4,1) both;}

  .card h2.big{
    font-size:clamp(46px,16.5vw,84px);font-weight:900;letter-spacing:.02em;line-height:1.08;
    background:linear-gradient(92deg,#ffe08a,#ff8fb0,#c79bff,#8ff0dd,#ffe08a,#ffa9c4);
    background-size:320% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:rainbow 4.2s linear infinite, glowPulse 2.8s ease-in-out infinite;
  }
  @keyframes rainbow{to{background-position:320% 0}}
  @keyframes glowPulse{
    0%,100%{filter:drop-shadow(0 0 14px rgba(255,175,214,.8)) drop-shadow(0 0 42px rgba(255,110,200,.45));}
    50%{filter:drop-shadow(0 0 26px rgba(255,215,240,1)) drop-shadow(0 0 74px rgba(255,120,220,.8));}
  }
  .card .sub{color:rgba(255,228,240,.92);font-size:clamp(15px,4.1vw,17px);margin-top:16px;}

  .card .pics{display:flex;gap:14px;justify-content:center;align-items:flex-end;margin-top:22px;}
  .card .pics img{
    display:block;height:min(30vw,132px);width:auto;border-radius:12px;
    filter:drop-shadow(0 10px 26px rgba(255,110,170,.55)) drop-shadow(0 0 18px rgba(255,150,200,.3));
  }
  .card .pic-c{animation:float 4.6s ease-in-out infinite;}
  .card .pic-d{animation:float 4.6s ease-in-out infinite .9s;}
  @keyframes rise{from{transform:translateY(24px) scale(.95);opacity:0}}
  .card h2{
    font-size:clamp(26px,8.6vw,40px);font-weight:800;letter-spacing:.06em;
    background:linear-gradient(100deg,#ffe1a8,#ffa9c4,#d9a6ff,#8ff0dd);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 20px rgba(255,150,190,.5));
  }
  .card p{margin-top:16px;font-size:clamp(14px,3.9vw,15.5px);line-height:2;color:rgba(255,238,244,.84);}
  .card .dim{color:rgba(255,214,232,.5);font-size:.92em;}
  .card .again{
    margin-top:24px;padding:11px 26px;border-radius:999px;cursor:pointer;font-family:inherit;
    font-size:14px;color:#fff;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);
  }
</style>
</head>

<script>
(function () {
  "use strict";

  var $ = function (s) { return document.querySelector(s); };
  var cvs = $("#fx"), g2 = cvs.getContext("2d");
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = Math.floor(W * DPR);
    cvs.height = Math.floor(H * DPR);
    cvs.style.width = W + "px"; cvs.style.height = H + "px";
    g2.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  /* 背景星点 */
  var stars = [], i;
  for (i = 0; i < 110; i++) {
    stars.push({
      x: Math.random(), y: Math.random(),
      r: Math.random() * 1.35 + 0.22,
      ph: Math.random() * 6.28, sp: 0.4 + Math.random() * 0.85
    });
  }
  function drawStars(t) {
    for (var k = 0; k < stars.length; k++) {
      var s = stars[k];
      g2.globalAlpha = 0.16 + 0.5 * (0.5 + 0.5 * Math.sin(t / 1000 * s.sp + s.ph));
      g2.fillStyle = "#ffe9dc";
      g2.beginPath();
      g2.arc(s.x * W, s.y * H, s.r, 0, 6.2832);
      g2.fill();
    }
    g2.globalAlpha = 1;
  }

  /* 粒子 */
  var PAL = ["#ffb37a", "#ff88ad", "#d9a6ff", "#8ff0dd", "#ffe08a", "#ff6f9c"];
  var parts = [];
  var pick = function () { return PAL[(Math.random() * PAL.length) | 0]; };

  function spawnNote(x, y) {
    parts.push({
      k: "n", x: x, y: y,
      vx: (Math.random() - 0.5) * 1.7,
      vy: -(1.4 + Math.random() * 1.5),
      a: 1, rot: (Math.random() - 0.5) * 0.5, vr: (Math.random() - 0.5) * 0.05,
      size: 13 + Math.random() * 12,
      c: pick(), txt: Math.random() < 0.5 ? "\u266a" : "\u266b"
    });
  }
  function spawnConfetti(x, y, n, dir) {
    for (var k = 0; k < n; k++) {
      parts.push({
        k: "c", x: x, y: y,
        vx: (Math.random() - 0.5) * 9,
        vy: dir > 0 ? -(4 + Math.random() * 7) : (1 + Math.random() * 3.5),
        w: 4 + Math.random() * 5, h: 7 + Math.random() * 8,
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.42,
        c: pick(), a: 1
      });
    }
  }
  function stepParts(dt) {
    for (var k = parts.length - 1; k >= 0; k--) {
      var p = parts[k];
      if (p.k === "n") {
        p.x += p.vx; p.y += p.vy; p.vy += 0.012; p.rot += p.vr; p.a -= 0.011;
        if (p.a <= 0 || p.y < -50) { parts.splice(k, 1); continue; }
        g2.save(); g2.globalAlpha = Math.max(p.a, 0);
        g2.translate(p.x, p.y); g2.rotate(p.rot);
        g2.fillStyle = p.c; g2.font = p.size + "px serif";
        g2.fillText(p.txt, 0, 0); g2.restore();
      } else {
        p.vy += 0.22; p.vx *= 0.995;
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        p.a -= 0.0045 * (dt / 16.7);
        if (p.y > H + 70 || p.a <= 0) { parts.splice(k, 1); continue; }
        g2.save(); g2.globalAlpha = Math.max(p.a, 0);
        g2.translate(p.x, p.y); g2.rotate(p.rot);
        g2.fillStyle = p.c; g2.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        g2.restore();
      }
    }
    g2.globalAlpha = 1;
  }

  /* 歌词（来自原视频字幕时间轴） */
  var LYR = [
    { t: 0.10, e: 3.80, s: "对所有的烦恼说拜拜" },
    { t: 3.80, e: 7.80, s: "对所有的快乐说嗨嗨" },
    { t: 7.80, e: 9.24, s: "亲爱的" },
    { t: 9.24, e: 12.10, s: "亲爱的生日快乐" },
    { t: 12.10, e: 15.25, s: "每一天都精彩" },
    { t: 15.73, e: 19.67, s: "看幸福的花儿为你盛开" },
    { t: 19.67, e: 23.81, s: "听美妙的音乐为你喝彩" },
    { t: 23.81, e: 28.07, s: "亲爱的亲爱的生日快乐" },
    { t: 28.07, e: 32.60, s: "祝你幸福永远" }
  ];

  var bgm = $("#bgm");
  var singer = $("#singer");
  var mouth = $("#mouth");
  var nameEl = $("#name");
  var aliasEl = $("#alias");
  var lyrEl = $("#lyr");
  var startBtn = $("#start");
  var card = $("#card");

  var playing = false, finished = false, curIdx = -1, mouthTimer = null;
  var taps = 0;

  function setLyric(idx) {
    if (idx === curIdx) return;
    curIdx = idx;
    var box = lyrEl;
    box.classList.remove("on");
    setTimeout(function () {
      if (idx < 0 || idx >= LYR.length) { box.textContent = ""; return; }
      box.textContent = LYR[idx].s;
      box.classList.add("on");
    }, idx < 0 ? 0 : 170);

    if (idx >= 0) {
      var r = singer.getBoundingClientRect();
      if (r.width > 0) {
        for (var k = 0; k < 4; k++) {
          spawnNote(r.left + r.width * (0.15 + Math.random() * 0.7), r.top + r.height * 0.3);
        }
      }
      if (mouth) {
        mouth.setAttribute("ry", "8.5");
        clearTimeout(mouthTimer);
        mouthTimer = setTimeout(function () { mouth.setAttribute("ry", "5"); }, 320);
      }
    }
  }

  function tick() {
    if (!playing) return;
    var t = bgm.currentTime;
    var idx = -1;
    for (var k = 0; k < LYR.length; k++) {
      if (t >= LYR[k].t && t < LYR[k].e) { idx = k; break; }
    }
    if (t >= LYR[LYR.length - 1].e) idx = LYR.length - 1;
    setLyric(idx);
  }

  function finish() {
    if (finished) return;
    finished = true;
    card.classList.add("show");
    for (var k = 0; k < 7; k++) {
      (function (k) {
        setTimeout(function () {
          spawnConfetti(W / 2 + (Math.random() - 0.5) * W * 0.7,
            H * 0.1 + Math.random() * H * 0.25, 24, 1);
        }, k * 240);
      })(k);
    }
  }

  function start() {
    if (playing) return;
    playing = true;
    finished = false;
    startBtn.classList.add("gone");
    singer.classList.add("in");
    singer.classList.add("sing");

    spawnConfetti(W / 2, H * 0.98, 34, 1);

    /* 必须在点击手势的同步调用栈里 play()，否则 iOS Safari 会拒绝播放 */
    try {
      bgm.currentTime = 0;
      var pr = bgm.play();
      if (pr && pr.catch) {
        pr.catch(function () {
          startBtn.textContent = "再点我一下 · 让小菲开嗓";
          startBtn.classList.remove("gone");
        });
      }
    } catch (e) {
      startBtn.textContent = "再点我一下 · 让小菲开嗓";
      startBtn.classList.remove("gone");
    }
  }

  function reset() {
    card.classList.remove("show");
    parts.length = 0;
    playing = false;
    finished = false;
    curIdx = -1;
    lyrEl.classList.remove("on");
    lyrEl.textContent = "";
    start();
  }

  bgm.addEventListener("ended", finish);

  startBtn.addEventListener("click", start);
  $("#again").addEventListener("click", reset);

  /* 隐藏彩蛋：连点名字三次 */
  nameEl.addEventListener("click", function () {
    if (taps >= 3) return;
    taps++;
    nameEl.classList.remove("bump");
    void nameEl.offsetWidth;
    nameEl.classList.add("bump");
    if (taps === 3) {
      aliasEl.classList.add("show");
      setTimeout(function () {
        spawnConfetti(W / 2, H * 0.45, 18, 1);
      }, 120);
    }
  });

  /* 主循环 */
  var last = performance.now();
  function frame(t) {
    var dt = Math.min(t - last, 40);
    last = t;
    g2.clearRect(0, 0, W, H);
    drawStars(t);
    stepParts(dt);
    tick();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
